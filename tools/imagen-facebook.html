<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imágenes para Facebook</title>
<!--
  FOTO DE PERFIL (720 x 720) Y PORTADA (1640 x 624) DE LA PÁGINA DE FACEBOOK.
  ?perfil  → solo la foto de perfil;  ?portada → solo la portada.
  Para volver a hacerlas (Chrome sin ventana, desde la carpeta de la web):
    chrome --headless --hide-scrollbars --window-size=720,720   --screenshot=assets/img/redes/facebook-perfil.png  "file:///.../tools/imagen-facebook.html?perfil"
    chrome --headless --hide-scrollbars --window-size=1640,624  --screenshot=assets/img/redes/facebook-portada.png "file:///.../tools/imagen-facebook.html?portada"
  La foto de perfil de la página tapa el centro de la portada (en el móvil casi
  todo el alto): el texto va a los lados, ordenadores a la izquierda y webs a la derecha.
-->
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<style>
html,body{margin:0;background:#000;overflow:hidden}
.perfil,.portada{display:none}
body.ver-perfil .perfil,body.ver-portada .portada{display:block}

.perfil{position:relative;width:720px;height:720px;background:radial-gradient(circle at 50% 42%,#1c1c21 0%,#08080a 62%,#000 100%)}
.perfil img{position:absolute;left:50%;top:50%;width:400px;transform:translate(-50%,-52%)}

.portada{position:relative;width:1640px;height:624px;overflow:hidden;font-family:var(--f-sans);color:var(--ink);background:#000}
/* La foto de perfil tapa el centro (en el móvil, casi todo el alto): un lado para
   ordenadores (fotograma del vídeo), otro para webs (dispositivos de og-webs.jpg). */
.pc{position:absolute;left:0;top:0;width:56%;height:100%;background:url("../assets/video/taller-poster.webp") 30% 70%/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 100%);mask-image:linear-gradient(90deg,#000 40%,transparent 100%)}
.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 60%,rgba(0,0,0,.2) 100%)}
.web{position:absolute;right:50px;bottom:28px;width:480px;height:232px;background:url("../assets/img/og-webs.jpg") -428px -118px/960px 504px no-repeat;-webkit-mask-image:radial-gradient(ellipse 58% 62% at 52% 50%,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse 58% 62% at 52% 50%,#000 72%,transparent 100%)}
.eyebrow{position:absolute;left:0;right:0;top:34px;margin:0;text-align:center;font-size:16px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.lado{position:absolute;top:118px;width:520px}
.lado.izq{left:72px}
.lado.der{right:50px;text-align:right}
h1{margin:0;font-size:68px;line-height:.98;font-weight:650;letter-spacing:-.045em}
.silver{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:18px 0 0;font-size:21px;color:var(--muted)}
.cta{display:inline-block;margin-top:26px;background:#fff;color:#000;font-weight:600;font-size:22px;padding:13px 26px;border-radius:999px}
</style>
</head>
<body>
<div class="perfil"><img src="../assets/img/marca-gris.svg" alt=""></div>
<div class="portada">
  <div class="pc"></div>
  <div class="web"></div>
  <p class="eyebrow">alextoll.store · Madrid</p>
  <div class="lado izq">
    <h1>Arreglo tu<br><span class="silver">ordenador.</span></h1>
    <p class="sub">Limpieza · SSD y RAM · Windows y Linux</p>
    <span class="cta">Pide tu diagnóstico</span>
  </div>
  <div class="lado der">
    <h1>Creo tu<br><span class="silver">página web.</span></h1>
    <p class="sub">Webs rápidas y modernas para negocios</p>
  </div>
</div>
<script>document.body.className = location.search.includes('portada') ? 'ver-portada' : 'ver-perfil';</script>
</body>
</html>
