# =========================================================
# Alextoll · nginx dentro de Docker, detrás de Cloudflare Tunnel (NAS UGREEN)
# (seguridad reforzada 20/10/2026, igual que el portfolio alextoll.xyz)
# ---------------------------------------------------------
# Es la misma configuración que deploy/nginx-alextoll.conf, adaptada:
#  - El HTTPS lo pone Cloudflare: aquí solo se escucha en el puerto 80
#    dentro de Docker (el túnel entra por ahí; no se abre nada en el router).
#  - La IP real del visitante llega en la cabecera CF-Connecting-IP.
#  - El contador de visitas es el contenedor "estadisticas".
#  - Las cabeceras de seguridad se ponen UNA vez, a nivel de server. Lo que cambia
#    por página (caché, CSP, robots...) se decide con los map de abajo, porque nginx
#    descarta las cabeceras de seguridad en cualquier location que añada las suyas.
# Guía: deploy/SUBIR-AL-NAS.md
# =========================================================

# --- IP real del visitante ---
# Por el túnel todas las peticiones llegan desde el contenedor de cloudflared, en una
# red de Docker (172.16.0.0/12). Solo se cree CF-Connecting-IP si viene de ahí: desde
# la LAN (192.168.x.x) o cualquier otro sitio, la cabecera se ignora y no sirve para
# saltarse los límites.
# OJO: este bloque va dentro de server{} más abajo (set_real_ip_from es por server).

# --- Caché por tipo de archivo (se aplica la primera que coincide) ---
map $uri $cache_control {
    # Panel de estadísticas: nunca en cachés
    /estadisticas.html                                 "no-store";
    # El contador y los presupuestos ponen su propio Cache-Control: no-store
    ~^/api/                                             "";
    ~^/__/auth/                                         "";
    # Código de SvelteKit (_app/immutable): el nombre cambia con cada versión → un año
    ~^/_app/immutable/                                  "public, max-age=31536000, immutable";
    # Fuentes: no cambian nunca (un año)
    ~^/assets/fonts/                                    "public, max-age=31536000, immutable";
    # three.js lleva la versión en la carpeta y los modelos 3D en el nombre (pc404-2.glb): un año
    ~^/js/vendor/three-                                 "public, max-age=31536000, immutable";
    ~^/assets/3d/                                       "public, max-age=31536000, immutable";
    # Imágenes y vídeo: una semana (por eso las imágenes nuevas llevan nombre nuevo)
    ~^/assets/(img|video)/                              "public, max-age=604800";
    # Páginas, CSS y JS: el navegador y Cloudflare preguntan siempre si hay versión
    # nueva (si no ha cambiado, responden "sin cambios"). Así cada subida se ve al momento.
    ~*\.(html|css|js|json|webmanifest|xml|txt|vcf)$     "no-cache";
    default                                             "";
}

# --- Content-Security-Policy por página ---
# La web solo carga recursos propios. Excepciones:
#  - Web3Forms (formularios, plan B si falla el servidor propio)
#  - clientes.html: Firebase (inicio de sesión de Google, X, Microsoft y la base de datos)
#  - /__/auth/: páginas de Firebase servidas desde aquí; usan sus propios scripts → sin CSP
# Si añades una herramienta externa, añade su dominio aquí.
# script-src lleva 'unsafe-inline' porque SvelteKit arranca cada página con un
# script pequeño escrito dentro del HTML. No abre la puerta a otros scripts: cada
# página trae también su propia regla (<meta http-equiv="content-security-policy">)
# que solo deja pasar ESE script por su huella (sha256), y el navegador aplica las dos.
# style-src: la huella (sha256) con 'unsafe-hashes' deja pasar SOLO el estilo del aviso
# invisible para lectores de pantalla que SvelteKit pone en cada página (#svelte-announcer).
# Si al actualizar SvelteKit cambia ese estilo, la consola avisa; se calcula con:
#   printf '%s' "<estilo>" | openssl dgst -sha256 -binary | base64
# connect-src lleva blob: porque el 3D del 404 (three.js) lee la textura de su modelo (.glb)
# desde una dirección blob: que crea el propio navegador; sin él, esa textura no se carga.
map $uri $csp {
    /clientes.html  "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://apis.google.com; manifest-src 'self'; frame-src 'self' https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/__/auth/      "";
    default          "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self'; style-src 'self' 'unsafe-hashes' 'sha256-S8qMpvofolR8Mpjy4kQvEm7m1q8clzU4dfDH0AmvZjo='; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' blob: https://api.web3forms.com; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; upgrade-insecure-requests";
}

# Quién puede meter la página en un marco: nadie, salvo el iframe de Firebase,
# que lo carga la propia web (clientes.html) desde /__/auth/iframe.
map $uri $xfo {
    ~^/__/auth/  "SAMEORIGIN";
    default      "DENY";
}

# Aísla la ventana de la web de las que abra o la abran. clientes.html necesita
# hablar con las ventanas de Google y X (signInWithPopup) → allow-popups.
map $uri $coop {
    /clientes.html  "same-origin-allow-popups";
    ~^/__/auth/      "";
    default          "same-origin";
}

# Nadie más puede incrustar los archivos de la web en su página, salvo las imágenes
# para compartir: algunas redes las muestran cargándolas desde aquí.
map $uri $corp {
    ~^/assets/img/(og-|moviles/og-|redes/)  "cross-origin";
    ~^/__/auth/                             "";
    default                                 "same-origin";
}

# Páginas que no deben salir en buscadores
map $uri $robots {
    /estadisticas.html  "noindex, nofollow";
    /clientes.html      "noindex";
    /gracias.html       "noindex";
    default              "";
}

# La tarjeta de contacto se descarga como contacto
map $uri $descarga {
    /assets/alextoll.vcf  "attachment; filename=Alextoll.vcf";
    default                "";
}

# Métodos permitidos: leer (GET/HEAD) en toda la web; enviar (POST) solo al contador
# y a los presupuestos (/api/) y a las páginas de inicio de sesión de Firebase.
map "$request_method:$uri" $metodo_no {
    ~^(GET|HEAD):                0;
    ~^POST:/api/                 0;
    ~^(POST|OPTIONS):/__/auth/   0;
    default                      1;
}

# --- Límites por visitante (IP real) ---
# Si alguien se pasa, recibe "429 Demasiadas peticiones" en vez de saturar el NAS.
#  - paginas / archivos: una visita pide ~40 archivos casi a la vez; el margen deja que
#    una clase entera la abra desde la misma IP.
#  - alx_panel: intentos de entrar al panel de estadísticas (10 por minuto)
#  - alx_api:   avisos del contador de visitas (2 por segundo, con margen para ráfagas)
#  - alx_form:  presupuestos de móviles (pocos por minuto; el contador limita además 5 por hora)
limit_req_zone  $binary_remote_addr zone=paginas:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=archivos:10m rate=50r/s;
limit_req_zone  $binary_remote_addr zone=alx_panel:1m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=alx_api:2m   rate=2r/s;
limit_req_zone  $binary_remote_addr zone=alx_form:1m  rate=6r/m;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;
limit_req_status  429;
limit_conn_status 429;

# www.alextoll.store → alextoll.store
server {
    listen 80;
    server_name www.alextoll.store;
    return 301 https://alextoll.store$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Redirecciones relativas: detrás del túnel nginx no sabe que la web va por https
    absolute_redirect off;

    # IP real del visitante (ver arriba): solo desde la red de Docker del túnel
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # --- Contra saturar el servidor ---
    # Cuerpo de las peticiones: pequeño salvo en los presupuestos (ver /api/presupuesto-movil)
    client_max_body_size 8k;
    # Conexiones lentas a propósito (ataque "slowloris"): se cortan pronto
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 200;
    # Peticiones a la vez por visitante
    limit_conn conexiones 60;

    if ($metodo_no) { return 405; }

    # --- Cabeceras de seguridad (las heredan todas las location; ninguna pone add_header) ---
    # Una cabecera con valor vacío no se envía: así cada map la quita donde no toca.
    # HSTS: el navegador recuerda durante dos años que esta web va siempre por HTTPS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $xfo always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    add_header Content-Security-Policy $csp always;
    add_header Cross-Origin-Opener-Policy $coop always;
    add_header Cross-Origin-Resource-Policy $corp always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Robots-Tag $robots always;
    add_header Content-Disposition $descarga;
    add_header Cache-Control $cache_control;

    # --- Compresión ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json application/xml model/gltf-binary;
    gzip_min_length 1024;

    # --- Contacto para avisar de fallos de seguridad (RFC 9116) ---
    # ^~ gana a la regla de abajo que bloquea lo que empieza por punto.
    location ^~ /.well-known/ {
        limit_req zone=paginas burst=50 nodelay;
        try_files $uri =404;
    }

    # --- Archivos internos que no deben verse en internet (por si se copian sin querer) ---
    location ~ ^/(tools|netlify|docs|deploy|servidor|reports|research_notes|node_modules)(/|$) { return 404; }
    location ~ ^/(package(-lock)?\.json|netlify\.toml)$ { return 404; }
    location ~ \.md$ { return 404; }
    location ~ /\. { return 404; }

    # --- Direcciones cortas ---
    # La antigua página "Sobre mí" (y su versión en inglés) ahora es el portfolio: https://alextoll.xyz/
    location ~ ^/(sobre-mi(\.html)?|en/about(\.html)?)/?$ { return 301 https://alextoll.xyz/; }
    # /ordenadores, /ordenadores/, /webs, /diagnostico/... llevan a su página .html
    location ~ ^/(ordenadores|webs|reparacion-moviles|diagnostico|privacidad|cookies|aviso-legal|resena|clientes)/?$ { return 301 /$1.html; }
    # Versión en inglés (carpeta en/): /en lleva a /en/ y /en/computers a /en/computers.html
    location = /en { return 301 /en/; }
    location ~ ^/en/([a-z0-9-]+)/?$ { return 301 /en/$1.html; }

    # --- Archivos (CSS, JS, código de SvelteKit en _app/, fuentes, imágenes, vídeo) ---
    location /assets/ {
        limit_req zone=archivos burst=400 nodelay;
        try_files $uri =404;
    }
    # Modelos 3D (.glb) del 404: tipo correcto para que se compriman (570 KB → 180 KB)
    location /assets/3d/ {
        limit_req zone=archivos burst=400 nodelay;
        types { model/gltf-binary glb; }
        try_files $uri =404;
    }
    location = /assets/alextoll.vcf {
        default_type "text/vcard; charset=utf-8";
        try_files $uri =404;
    }
    location ~ ^/(css|js|_app)/ {
        limit_req zone=archivos burst=400 nodelay;
        try_files $uri =404;
    }

    # Páginas de inicio de sesión de Firebase servidas desde esta web (alextoll.store/__/auth/...).
    # Microsoft entra por redirección (su ventana emergente pierde el contacto con la web) y la
    # redirección solo funciona en Chrome/Safari/Opera si estas páginas están en el mismo dominio.
    # Se comprueba el certificado de Firebase: nadie puede hacerse pasar por Google entre medias.
    location /__/auth/ {
        limit_req zone=paginas burst=20 nodelay;
        proxy_pass https://alextoll-web-959a5.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_ssl_name alextoll-web-959a5.firebaseapp.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host alextoll-web-959a5.firebaseapp.com;
    }

    # --- Contador de visitas y panel de estadísticas (contenedor "estadisticas") ---
    # Entrar al panel: pocos intentos por minuto (frena a quien quiera adivinar la clave)
    location = /api/estadisticas {
        limit_req zone=alx_panel burst=5 nodelay;
        proxy_pass http://estadisticas:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Presupuesto de cambio de pantalla: lleva fotos (ya reducidas en el navegador), por eso admite más tamaño
    location = /api/presupuesto-movil {
        limit_req zone=alx_form burst=3 nodelay;
        proxy_pass http://estadisticas:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 7m;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=alx_api burst=20 nodelay;
        proxy_pass http://estadisticas:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # --- Páginas ---
    location / {
        limit_req zone=paginas burst=50 nodelay;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
