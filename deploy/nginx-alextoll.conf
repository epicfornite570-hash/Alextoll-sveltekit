# =========================================================
# Alextoll · configuración de nginx (equivale a netlify.toml)
# ---------------------------------------------------------
# AHORA NO SE USA: la web está en el NAS con deploy/nas/nginx.conf, que es la
# configuración buena (límites, CSP por página, Firebase...). Esta es la versión
# sencilla para un servidor propio con certbot; si la usas, copia de allí lo que falte.
# Guía completa paso a paso: deploy/SUBIR-A-NGINX.md
# 1. Sube la carpeta de la web al servidor, p. ej. a /var/www/alextoll
#    (sin .git, docs, tools, netlify ni servidor: no hacen falta para que se vea).
# 2. Copia este archivo a /etc/nginx/sites-available/alextoll
#    y actívalo:  sudo ln -s /etc/nginx/sites-available/alextoll /etc/nginx/sites-enabled/
# 3. Cambia "root" si subes la web a otra carpeta.
# 4. Comprueba y recarga:  sudo nginx -t && sudo systemctl reload nginx
# 5. HTTPS gratis con Let's Encrypt:  sudo certbot --nginx -d alextoll.store -d www.alextoll.store
#    (certbot añade solo el bloque de "listen 443" y la redirección de http a https).
# =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name alextoll.store www.alextoll.store;

    root /var/www/alextoll;                       # CAMBIAR si la subes a otra carpeta
    index index.html;
    charset utf-8;

    # --- Cabeceras de seguridad (las mismas que en netlify.toml) ---
    # Si añades una herramienta externa, añade su dominio en la Content-Security-Policy.
    # script-src lleva 'unsafe-inline' porque SvelteKit arranca cada página con un
    # script pequeño escrito dentro del HTML. No abre la puerta a otros scripts: cada
    # página trae también su propia regla (<meta http-equiv="content-security-policy">)
    # que solo deja pasar ESE script por su huella (sha256), y el navegador aplica las dos.
    # style-src: la huella (sha256) con 'unsafe-hashes' deja pasar SOLO el estilo del aviso
    # invisible para lectores de pantalla que SvelteKit pone en cada página (#svelte-announcer).
    # Si al actualizar SvelteKit cambia ese estilo, la consola avisa; se calcula con:
    #   printf '%s' "<estilo>" | openssl dgst -sha256 -binary | base64
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self'; style-src 'self' 'unsafe-hashes' 'sha256-S8qMpvofolR8Mpjy4kQvEm7m1q8clzU4dfDH0AmvZjo='; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' blob: https://api.web3forms.com; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # --- Compresión ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
    gzip_min_length 1024;

    # --- Archivos internos que no deben verse en internet ---
    location ~ ^/(tools|netlify|docs|deploy|servidor)(/|$) { return 404; }
    location ~ ^/(package\.json|README\.md|LEEME\.md|netlify\.toml|\.git.*)$ { return 404; }
    location ~ /\. { return 404; }

    # --- Direcciones cortas ---
    # La antigua página "Sobre mí" (y su versión en inglés) ahora es el portfolio: https://alextoll.xyz/
    location ~ ^/(sobre-mi(\.html)?|en/about(\.html)?)/?$ { return 301 https://alextoll.xyz/; }
    # /ordenadores, /ordenadores/, /webs, /diagnostico/... llevan a su página .html
    location ~ ^/(ordenadores|webs|reparacion-moviles|diagnostico|privacidad|cookies|aviso-legal|resena)/?$ { return 301 /$1.html; }

    # --- Caché ---
    # Fuentes: no cambian nunca (un año)
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Imágenes y vídeo: una semana
    location ~ ^/assets/(img|video)/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Tarjeta de contacto: que el móvil la abra como contacto
    location = /assets/alextoll.vcf {
        default_type "text/vcard; charset=utf-8";
        add_header Content-Disposition "attachment; filename=Alextoll.vcf";
        try_files $uri =404;
    }
    # El panel de estadísticas no debe guardarse en cachés ni salir en buscadores
    # (en nginx, un add_header dentro de location anula los de arriba: se repiten los de seguridad)
    location = /estadisticas.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-hashes' 'sha256-S8qMpvofolR8Mpjy4kQvEm7m1q8clzU4dfDH0AmvZjo='; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # --- Contador de visitas y panel de estadísticas (servidor/api.mjs, ver deploy/SUBIR-A-NGINX.md) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 8k;
    }

    # --- Páginas ---
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
